name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.1"
          use-cache: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast

      - name: Package binary and generate checksum
        run: |
          archive="xkb-layout-${{ matrix.arch }}.tar.gz"
          test -x zig-out/bin/xkb-layout
          tar -czf "$archive" -C zig-out/bin xkb-layout
          sha256sum "$archive" > "$archive.sha256"

      # Keep v4 for compatibility with both GitHub and act's artifact server.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xkb-layout-${{ matrix.arch }}
          path: |
            xkb-layout-${{ matrix.arch }}.tar.gz
            xkb-layout-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xkb-layout-*
          path: release
          merge-multiple: true

      - name: Verify release assets
        run: |
          for arch in x86_64 arm64; do
            archive="xkb-layout-$arch.tar.gz"
            test -f "release/$archive"
            test -f "release/$archive.sha256"
            tar -tzf "release/$archive" | grep -qx xkb-layout
            (cd release && sha256sum --check "$archive.sha256")
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/xkb-layout-*.tar.gz
            release/xkb-layout-*.tar.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

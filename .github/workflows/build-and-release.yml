name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - arch: x86_64
            name: xkb-layout-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev

      - name: Build
        run: |
          make release
          mkdir artifacts
          tar -czvf ${{ matrix.name }}.tar.gz xkb-layout

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Flatten artifacts structure
        run: |
          mkdir -p release
          find artifacts -type f -name "*.tar.gz" -exec cp {} release/ \;
          ls -R release

      - name: Create Codeberg Release
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag: ${{ github.ref_name }}
          release-dir: release
          release-notes-assistant: true

name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - artifact: x86_64-glibc
            libc: glibc
            runner: ubuntu-latest
          - artifact: arm64-glibc
            libc: glibc
            runner: ubuntu-24.04-arm
          - artifact: x86_64-musl
            libc: musl
            runner: ubuntu-latest
          - artifact: arm64-musl
            libc: musl
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.1"
          use-cache: false

      - name: Install glibc build dependencies
        if: matrix.libc == 'glibc'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Build glibc release binary
        if: matrix.libc == 'glibc'
        run: zig build -Doptimize=ReleaseFast

      - name: Build musl release binary in Alpine
        if: matrix.libc == 'musl'
        run: |
          zig_dir=$(dirname "$(readlink -f "$(command -v zig)")")
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$zig_dir:/opt/zig:ro" \
            -w /src \
            alpine:3.22 \
            sh -eu -c '
              apk add --no-cache libx11-dev
              /opt/zig/zig build -Doptimize=ReleaseFast
              ldd_output=$(ldd zig-out/bin/xkb-layout)
              printf "%s\n" "$ldd_output"
              printf "%s\n" "$ldd_output" | grep -q "/lib/ld-musl-"
            '

      - name: Package binary and generate checksum
        run: |
          archive="xkb-layout-${{ matrix.artifact }}.tar.gz"
          test -x zig-out/bin/xkb-layout
          tar -czf "$archive" -C zig-out/bin xkb-layout
          sha256sum "$archive" > "$archive.sha256"

      # Keep v4 for compatibility with both GitHub and act's artifact server.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xkb-layout-${{ matrix.artifact }}
          path: |
            xkb-layout-${{ matrix.artifact }}.tar.gz
            xkb-layout-${{ matrix.artifact }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xkb-layout-*
          path: release
          merge-multiple: true

      - name: Verify release assets
        run: |
          for variant in x86_64-glibc arm64-glibc x86_64-musl arm64-musl; do
            archive="xkb-layout-$variant.tar.gz"
            test -f "release/$archive"
            test -f "release/$archive.sha256"
            tar -tzf "release/$archive" | grep -qx xkb-layout
            (cd release && sha256sum --check "$archive.sha256")
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/xkb-layout-*.tar.gz
            release/xkb-layout-*.tar.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

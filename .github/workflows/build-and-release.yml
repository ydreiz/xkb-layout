name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - arch: x86_64
            name: xkb-layout-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev

      - name: Build
        run: |
          make release
          mkdir artifacts
          tar -czvf ${{ matrix.name }}.tar.gz xkb-layout

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: xkb-layout-*
          merge-multiple: true

      - name: Create Codeberg Release
        uses: actions/forgejo-release@v2.12.1
        with:
          direction: artifacts
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag: ${{ github.ref_name }}
          release-dir: artifacts
          release-notes-assistant: true

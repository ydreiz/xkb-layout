name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.1"
          use-cache: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast

      - name: Package binary
        run: |
          test -x zig-out/bin/xkb-layout
          tar -czf xkb-layout-x86_64.tar.gz -C zig-out/bin xkb-layout

      # Keep v4 for compatibility with both GitHub and act's artifact server.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xkb-layout-x86_64
          path: xkb-layout-x86_64.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: xkb-layout-x86_64
          path: release

      - name: Verify release asset
        run: |
          test -f release/xkb-layout-x86_64.tar.gz
          tar -tzf release/xkb-layout-x86_64.tar.gz | grep -qx xkb-layout

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/xkb-layout-x86_64.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true

name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: codeberg-small
    strategy:
      matrix:
        include:
          - arch: x86_64
            artifact_name: xkb-layout-x86_64
          - arch: arm64
            artifact_name: xkb-layout-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev

      - name: Install dependencies (ARM64 Cross-Compile)
        if: matrix.arch == 'arm64'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
          sudo sed -i 's/deb-src http/deb-src [arch=amd64] http/g' /etc/apt/sources.list

          if [ -d /etc/apt/sources.list.d ]; then
            find /etc/apt/sources.list.d/ -name "*.sources" -exec sudo sed -i 's/Architectures: /Architectures: amd64 /g' {} +
          fi

          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list

          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libx11-dev:arm64

      - name: Build
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            make CC=aarch64-linux-gnu-gcc release
          else
            make release
          fi
          tar -czvf ${{ matrix.artifact_name }}.tar.gz xkb-layout

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz

  release:
    needs: build
    runs-on: codeberg-small
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: ./artifacts

      - name: Create Codeberg Release
        uses: actions/release-action@v1
        with:
          allowUpdates: true
          artifacts: "./artifacts/**/*.tar.gz"
          token: ${{ secrets.RELEASE_TOKEN }}
